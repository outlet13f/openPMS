# openPMS에 배포 결과를 알린다. Argo CD Notifications의 설정이다.
# 1) argocd-notifications-secret에 <웹훅 비밀>을 키 openpms-webhook-secret으로 넣는다(아래 Secret 예).
#    ConfigMap에는 비밀을 직접 적지 않고 $openpms-webhook-secret으로만 가리킨다.
# 2) 앱(Application)마다 주석 openpms.repository(openPMS 프로젝트에 붙은 저장소 경로, group/name)와 openpms.environment를 단다.
# 커밋 번호는 보내지 않는다. 이미지 태그에서 openPMS가 뽑는다(관리 › CI/CD 연동의 이미지 태그 규칙).
apiVersion: v1
kind: Secret
metadata:
  name: argocd-notifications-secret
type: Opaque
stringData:
  openpms-webhook-secret: <웹훅 비밀>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
data:
  service.webhook.openpms: |
    url: {{WEBHOOK_URL}}
    headers:
    - name: Content-Type
      value: application/json
    - name: X-OpenPMS-Token
      value: $openpms-webhook-secret
  template.openpms-deployment-succeeded: |
    webhook:
      openpms:
        method: POST
        body: |
          {"type":"deployment","repository":"{{index .app.metadata.annotations "openpms.repository"}}","id":"{{.app.metadata.name}}-{{.app.status.operationState.startedAt}}","image":"{{index .app.status.summary.images 0}}","environment":"{{index .app.metadata.annotations "openpms.environment"}}","status":"success","url":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}","at":"{{.app.status.operationState.finishedAt}}"}
  template.openpms-deployment-failed: |
    webhook:
      openpms:
        method: POST
        body: |
          {"type":"deployment","repository":"{{index .app.metadata.annotations "openpms.repository"}}","id":"{{.app.metadata.name}}-{{.app.status.operationState.startedAt}}","image":"{{index .app.status.summary.images 0}}","environment":"{{index .app.metadata.annotations "openpms.environment"}}","status":"failed","url":"{{.context.argocdUrl}}/applications/{{.app.metadata.name}}","at":"{{.app.status.operationState.finishedAt}}"}
  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [openpms-deployment-succeeded]
  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [openpms-deployment-failed]
# 앱 주석 예:
#   metadata:
#     annotations:
#       openpms.repository: group/name
#       openpms.environment: production
#       notifications.argoproj.io/subscribe.on-sync-succeeded.openpms: ""
#       notifications.argoproj.io/subscribe.on-sync-failed.openpms: ""
