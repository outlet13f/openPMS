# openPMS configuration. Every deploy-specific value comes from an environment variable (see .env.example).
server:
  port: ${PORT:8090}
  servlet:
    session:
      timeout: ${OPENPMS_SESSION_TIMEOUT:8h}
      cookie:
        name: OPENPMS_SESSION
        http-only: true
        same-site: lax
        secure: ${OPENPMS_SECURE_COOKIES:true}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: openpms
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${OPENPMS_DB_URL}
    username: ${OPENPMS_DB_USER}
    password: ${OPENPMS_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  jooq:
    sql-dialect: postgres
  session:
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  mail:
    host: ${OPENPMS_SMTP_HOST:localhost}
    port: ${OPENPMS_SMTP_PORT:25}
    username: ${OPENPMS_SMTP_USER:}
    password: ${OPENPMS_SMTP_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: ${OPENPMS_SMTP_STARTTLS:false}
  jackson:
    default-property-inclusion: always
  servlet:
    multipart:
      # a little above attachments.max_bytes (25MB); the exact limit is checked per upload
      max-file-size: 30MB
      max-request-size: 31MB

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

openpms:
  base-url: ${OPENPMS_BASE_URL:http://localhost:8090}
  admin-email: ${OPENPMS_ADMIN_EMAIL:}
  mail-from: ${OPENPMS_MAIL_FROM:openPMS <no-reply@example.com>}
  files-dir: ${OPENPMS_FILES_DIR:/data/files}
  jobs:
    # date alerts, notification mail, cleanup (jobs/Jobs.java); false for a web-only instance
    enabled: ${OPENPMS_JOBS_ENABLED:true}

---
# Development: dev data set (scripts/gen_dev_data.py), plain-http cookies.
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev
    # dev data is V1000; schema migrations added later (V4…) still apply on an existing dev database
    out-of-order: true
openpms:
  # the browser checks sign in many times a minute
  logins-per-minute: 500
  jobs:
    # off by default so browser checks are not disturbed; run one with POST /api/v1/dev/jobs/{name},
    # or start with OPENPMS_JOBS_ENABLED=true scripts/dev.sh run
    enabled: ${OPENPMS_JOBS_ENABLED:false}
server:
  servlet:
    session:
      cookie:
        secure: false
